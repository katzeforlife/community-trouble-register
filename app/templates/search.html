<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Search — CTR</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">CTR <span>COMMUNITY TROUBLE REGISTER</span></a><nav><a href="/">Home</a><a href="/search">Player search</a><a href="/docs">API docs</a></nav></header><main class="page"><div class="eyebrow">DATABASE LOOKUP</div><h1>Player search</h1><p class="lead">Search by SteamID64. Only confirmed records count as active status.</p><form id="lookup" class="lookup"><input id="steamid" placeholder="7656119xxxxxxxxxx" maxlength="17" required><button class="button primary">Search</button></form><pre id="result" class="result">Enter a SteamID64 to look up a record.</pre><footer>Records may be disputed or corrected. Do not treat unverified allegations as findings.</footer></main><script>
document.getElementById('lookup').addEventListener('submit',async e=>{e.preventDefault();const id=document.getElementById('steamid').value.trim();const out=document.getElementById('result');out.textContent='Searching…';try{const r=await fetch('/api/v1/players/'+encodeURIComponent(id));const data=await r.json();out.textContent=JSON.stringify(data,null,2)}catch(err){out.textContent='Lookup failed.'}});
</script></body></html>
